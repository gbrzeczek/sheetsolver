[package]
name = "api"
description = "sheetsolver web API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
model = { path = "../model", features = ["openapi"] }
checker = { path = "../checker" }
guillotine = { path = "../guillotine" }
treesearch = { path = "../treesearch" }
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tower-http = { version = "0.7.1", features = ["cors", "limit"] }
utoipa = { version = "5.5.0", features = ["uuid"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
clap = { version = "4.6.7", features = ["derive"] }
anyhow = "1.0.104"
thiserror = "2.0.21"
futures-util = "0.3.34"
tokio-stream = { version = "0.1.19", features = ["sync"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
