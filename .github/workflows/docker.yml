name: Docker

# Builds the single sheetsolver image (API + web UI, see the Dockerfile)
# and pushes it to ghcr.io/<owner>/sheetsolver.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tags: the branch (main), the version for v* tags (v1.2.3 → 1.2.3,
      # 1.2), the commit (sha-…), and latest for main.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sheetsolver
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploys the new image to the server over SSH, reaching it through
  # Tailscale: the runner joins the tailnet for this job only, so the
  # server's SSH port need not be open to the internet. Skipped until the
  # repository variable DEPLOY_HOST is set. Setup: docs/DEPLOY.md.
  deploy:
    needs: image
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Pull and restart on the server
        env:
          TARGET: ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/srv/sheetsolver' }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh_() { ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$TARGET" "$@"; }
          ssh_ "mkdir -p '$DEPLOY_DIR'"
          scp -i ~/.ssh/id_deploy -o BatchMode=yes deploy/docker-compose.yml "$TARGET:$DEPLOY_DIR/docker-compose.yml"
          # This job's token lets the server pull the image; it expires
          # with the job, and the server logs out again either way.
          printf '%s' "$GHCR_TOKEN" | ssh_ "set -e
            trap 'docker logout ghcr.io >/dev/null' EXIT
            docker login ghcr.io -u '$GHCR_USER' --password-stdin
            cd '$DEPLOY_DIR'
            docker compose pull
            docker compose up -d
            docker image prune -f"
