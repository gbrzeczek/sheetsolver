name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # The checked-in openapi.json must be what the Rust types generate.
      - run: npm run openapi && git diff --exit-code openapi.json
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      # The screen budget (e2e/budget.spec.ts) counts lines of text, so it
      # is measured in Inter, the first font of the UI's stack that Linux
      # has; without it the browser falls back to the wider DejaVu Sans
      # and wraps more lines.
      - run: sudo apt-get install -y --no-install-recommends fonts-inter
      - run: npm run e2e
