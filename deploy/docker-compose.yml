# sheetsolver on the server. The deploy job of .github/workflows/docker.yml
# copies this file to the server's deploy directory and runs
# `docker compose pull && docker compose up -d` there (docs/DEPLOY.md).
#
# The app joins the external `web` network, shared with the reverse proxy
# that handles TLS and the domain, and publishes no port on the host: the
# proxy reaches it at http://sheetsolver:8080. Create the network once
# with `docker network create web` if the proxy has not already.
#
# Jobs live in the server's memory, so there is no volume: a restart
# forgets every job (see docs/API.md, "Limits").

services:
  sheetsolver:
    image: ghcr.io/gbrzeczek/sheetsolver:latest
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - web
    environment:
      # Every `api` option is also a variable (`api --help`).
      SHEETSOLVER_LISTEN: "0.0.0.0:8080"
      # SHEETSOLVER_MAX_RUNNING_JOBS: "4"   # default: the CPU cores
      # SHEETSOLVER_MAX_QUEUED_JOBS: "32"
      # SHEETSOLVER_KEEP_JOBS_FOR: "3600"
      # SHEETSOLVER_MAX_JOBS_PER_CLIENT: "2"
      # Behind Cloudflare every request comes from the proxy; this header
      # holds the visitor's address, for the limit of jobs per visitor.
      # Anyone can send it, so the server must be reachable only through
      # Cloudflare (docs/DEPLOY.md, "Cloudflare").
      SHEETSOLVER_CLIENT_IP_HEADER: "CF-Connecting-IP"
    # A job takes at most about 200 MB (docs/FIELDS.md, "Size of a job"),
    # one per CPU core at a time: a runaway job then stops this container,
    # which restarts, not the server. Raise it on a server with many cores.
    mem_limit: 2g
    # The solvers use one CPU each; cap the container if the server does
    # other work.
    # cpus: 4

networks:
  web:
    external: true
