[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Tests keep overflow checks and debug assertions, which catch the i64
# geometry going wrong, but the search runs optimised: unoptimised, the
# golden tests take about 20 minutes. Set opt-level = 1 to step through
# these crates in a debugger more easily.
[profile.dev.package.guillotine]
opt-level = 3

[profile.dev.package.treesearch]
opt-level = 3
